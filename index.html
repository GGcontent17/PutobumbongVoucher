<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe8f0">
  <title>A little treat for you 💗</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #fff9fb, #ffe6ef 65%, #f9c9da); color: #68273d; font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(100%, 850px); text-align: center; }
    .note { margin: 0 0 15px; font-size: clamp(1rem, 3vw, 1.25rem); }
    img { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 18px 55px #8b315333; }
    .caption { margin: 16px 0 0; font: 500 .9rem/1.5 system-ui, sans-serif; color: #8f5266; }
  </style>
</head>
<body>
  <main>
    <p class="note">A sweet little surprise, made just for you 💗</p>
    <img src="voucher.png" alt="Pink voucher redeemable for one Putobumbong from East Putobumbong and four red roses from Likha Flower Shop or any flower shop. Show this voucher to Godspeed to claim.">
    <p class="caption">Show this voucher to Godspeed when you’re ready to claim your treats.</p>
  </main>
</body>
</html>
